<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" defer></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#lab-url"><b>System Design Atlas </b><span>448 guides · 29 animated lessons</span></a>
  <nav class="nav" aria-label="Sections"><a id="navLab" href="#lab-url">Lessons</a><a id="navLib" href="#library">Library</a></nav>
  <div class="progress" id="progress"></div>
</div></header>

<main class="wrap">
  <section id="viewLab" class="lab">
    <aside class="lesson-list" id="lessonList" aria-label="Lessons"></aside>
    <div class="lesson">
      <div>
        <p class="eyebrow" id="lGroup"></p>
        <h1 id="lTitle"></h1>
        <p class="blurb" id="lBlurb"></p>
        <div class="tabs" id="variants"></div>
      </div>
      <div class="stage-wrap" id="stageWrap"><svg id="stage" viewBox="0 0 960 460" role="img" aria-label="Animated diagram"></svg></div>
      <div class="controls" id="controls">
        <button class="btn" id="bRestart" title="Restart">⟲ Restart</button>
        <button class="btn" id="bBack" title="Previous step">◀ Back</button>
        <button class="btn primary" id="bPlay">▶ Play</button>
        <button class="btn" id="bNext" title="Next step">Next ▶</button>
        <div class="dots" id="dots"></div>
        <label class="speed" for="speed">Speed <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <div class="narr" id="narr"><span class="no" id="stepNo">1 / 1</span><p id="stepText"></p></div>
      <div class="sim-panel" id="simPanel" hidden></div>
      <div class="lesson-foot">
        <div><h2>Key takeaways</h2><ul class="take" id="takeaways"></ul></div>
        <div><h2>Read the guides</h2><div class="chips" id="related"></div></div>
      </div>
    </div>
  </section>

  <section id="viewLib" hidden>
    <div class="lib-head">
      <div><h1>Guide library</h1><p id="libSub">All guides from the repository, grouped by category.</p></div>
      <div class="search">
        <input type="search" id="q" placeholder="Search 400 guides: kafka, jwt, sharding…" aria-label="Search guides">
        <label class="chk" style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="hideLearned"> Hide learned</label>
      </div>
    </div>
    <nav class="catchips" id="catChips" aria-label="Categories"></nav>
    <div id="libBody"><p class="empty">Loading guides…</p></div>
  </section>

  <section id="viewGuide" hidden></section>
</main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script src="lessons-mern.js"></script>
<script src="app.js"></script>
</body>
</html>
